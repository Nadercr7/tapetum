name: release
# Publishes to PyPI when you push a tag like v0.2.0. Uses PyPI "trusted publishing",
# so no token is stored anywhere. One-time setup is in docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
