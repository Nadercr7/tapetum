[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapetum"
version = "0.2.2"
description = "Give your agent eyes. Paste a video link, get one timeline of what was said and what was on screen. No cookies, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nadercr7" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["video", "transcript", "agent", "mcp", "whisper", "youtube", "llm"]
dependencies = [
  "yt-dlp[default]>=2026.8.1",
  "youtube-transcript-api>=1.2",
  "pillow>=10.1",
  "numpy",
  "imageio-ffmpeg",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime"]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://nadercr7.github.io/tapetum/"
Source = "https://github.com/Nadercr7/tapetum"
Issues = "https://github.com/Nadercr7/tapetum/issues"

[project.scripts]
tapetum = "tapetum.cli:main"

[tool.hatch.build.targets.sdist]
include = ["src/tapetum", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/tapetum"]
